# 10 ATT&CK techniques grounded in MITRE ATT&CK (CLAUDE.md §5).
# Placeholders: session:src|dst, admin:src|dst, creds:who (requires only; one CompiledEdge per
# identity with a login|admin grant on dst), creds:sessions@src (grants only; every identity
# with a session grant on src), data:src|dst.
- id: phish
  attck: T1566
  channel: {protocol: https, port: 443}
  requires: []
  grants: [session:dst, admin:dst]
  base_success: 0.85
  cost: 1
  noise: 0.2

- id: exploit_public_app
  attck: T1190
  channel: {protocol: https, port: 443}
  requires: []
  grants: [session:dst]
  base_success: 0.75
  cost: 2
  noise: 0.5

- id: cred_dump
  attck: T1003
  channel: null
  requires: [admin:src]
  grants: [creds:sessions@src]
  base_success: 0.8
  cost: 1
  noise: 0.4

- id: priv_esc_local
  attck: T1068
  channel: null
  requires: [session:src]
  grants: [admin:src]
  base_success: 0.7
  cost: 2
